<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="740" viewBox="0 0 1040 740" role="img" aria-labelledby="title desc">
  <title id="title">The Rust learning curve</title>
  <desc id="desc">In each of 60 modules, positions 1–10 are guided, 11–30 applied, 31–45 mixed and 46–50 independent checkpoints. The next module starts with guidance again. Below, ten stages of 300 exercises take the learner from first programs to applied mastery.</desc>
  <rect x="0" y="0" width="1040" height="740" fill="#fcfaf5" />
  <text x="48" y="61" font-family="Lato, Arial, sans-serif" font-size="43" font-weight="700" fill="#143c38" text-anchor="start">The Rust learning curve</text>
  <text x="50" y="96" font-family="Lato, Arial, sans-serif" font-size="21" font-weight="400" fill="#42625c" text-anchor="start">Each new topic starts with guidance. Five independent checkpoints finish each module.</text>
  <line x1="50" y1="121" x2="990" y2="121" stroke="#d7dcd2" stroke-width="1" />
  <text x="50" y="158" font-family="Lato, Arial, sans-serif" font-size="23" font-weight="700" fill="#143c38" text-anchor="start">How much you do on your own</text>
  <text x="986" y="157" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="400" fill="#42625c" text-anchor="end">One 50-exercise module</text>
  <text x="169" y="336" font-family="Lato, Arial, sans-serif" font-size="18" font-weight="400" fill="#42625c" text-anchor="end">Guided</text>
  <line x1="195" y1="330" x2="982" y2="330" stroke="#d6ded6" stroke-width="1" stroke-dasharray="3 5" />
  <text x="169" y="294" font-family="Lato, Arial, sans-serif" font-size="18" font-weight="400" fill="#42625c" text-anchor="end">Applied</text>
  <line x1="195" y1="288" x2="982" y2="288" stroke="#d6ded6" stroke-width="1" stroke-dasharray="3 5" />
  <text x="169" y="252" font-family="Lato, Arial, sans-serif" font-size="18" font-weight="400" fill="#42625c" text-anchor="end">Mixed</text>
  <line x1="195" y1="246" x2="982" y2="246" stroke="#d6ded6" stroke-width="1" stroke-dasharray="3 5" />
  <text x="169" y="210" font-family="Lato, Arial, sans-serif" font-size="18" font-weight="400" fill="#42625c" text-anchor="end">Independent</text>
  <line x1="195" y1="204" x2="982" y2="204" stroke="#d6ded6" stroke-width="1" stroke-dasharray="3 5" />
  <text x="260.5" y="368" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="700" fill="#0c7161" text-anchor="middle">1–10</text>
  <text x="457.0" y="368" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="700" fill="#0c7161" text-anchor="middle">11–30</text>
  <text x="686.25" y="368" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="700" fill="#0c7161" text-anchor="middle">31–45</text>
  <text x="817.25" y="368" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="700" fill="#0c7161" text-anchor="middle">46–50</text>
  <polyline points="195.0,330 326.0,330 326.0,288 588.0,288 588.0,246 784.5,246 784.5,204 850.0,204" fill="none" stroke="#0c7161" stroke-width="5" stroke-linejoin="round" />
  <circle cx="195.0" cy="330" r="5" fill="#0c7161" />
  <circle cx="326.0" cy="288" r="5" fill="#0c7161" />
  <circle cx="588.0" cy="246" r="5" fill="#0c7161" />
  <circle cx="784.5" cy="204" r="5" fill="#0c7161" />
  <line x1="850.0" y1="204" x2="850.0" y2="330" stroke="#a84123" stroke-width="2" stroke-dasharray="5 5" />
  <line x1="850.0" y1="330" x2="982" y2="330" stroke="#a84123" stroke-width="5" />
  <circle cx="850.0" cy="330" r="5" fill="#a84123" />
  <text x="916.0" y="368" font-family="Lato, Arial, sans-serif" font-size="16" font-weight="700" fill="#a84123" text-anchor="middle">Next 1–10</text>
  <text x="195" y="398" font-family="Lato, Arial, sans-serif" font-size="16" font-weight="400" fill="#42625c" text-anchor="start">Exercise positions within a module</text>
  <line x1="50" y1="421" x2="990" y2="421" stroke="#d7dcd2" stroke-width="1" />
  <text x="50" y="458" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="700" fill="#143c38" text-anchor="start">Where the topics enter</text>
  <text x="986" y="458" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="400" fill="#42625c" text-anchor="end">Recommended course positions</text>
  <text x="50" y="501" font-family="Lato, Arial, sans-serif" font-size="16" font-weight="700" fill="#0c7161" text-anchor="start">0001–0300</text>
  <text x="165" y="501" font-family="Lato, Arial, sans-serif" font-size="20" font-weight="400" fill="#143c38" text-anchor="start">First programs</text>
  <text x="50" y="538" font-family="Lato, Arial, sans-serif" font-size="16" font-weight="700" fill="#0c7161" text-anchor="start">0301–0600</text>
  <text x="165" y="538" font-family="Lato, Arial, sans-serif" font-size="20" font-weight="400" fill="#143c38" text-anchor="start">Ownership and borrowing</text>
  <text x="50" y="575" font-family="Lato, Arial, sans-serif" font-size="16" font-weight="700" fill="#0c7161" text-anchor="start">0601–0900</text>
  <text x="165" y="575" font-family="Lato, Arial, sans-serif" font-size="20" font-weight="400" fill="#143c38" text-anchor="start">Modeling data and errors</text>
  <text x="50" y="612" font-family="Lato, Arial, sans-serif" font-size="16" font-weight="700" fill="#0c7161" text-anchor="start">0901–1200</text>
  <text x="165" y="612" font-family="Lato, Arial, sans-serif" font-size="20" font-weight="400" fill="#143c38" text-anchor="start">Reusable Rust</text>
  <text x="50" y="649" font-family="Lato, Arial, sans-serif" font-size="16" font-weight="700" fill="#0c7161" text-anchor="start">1201–1500</text>
  <text x="165" y="649" font-family="Lato, Arial, sans-serif" font-size="20" font-weight="400" fill="#143c38" text-anchor="start">Working with the system</text>
  <text x="537" y="501" font-family="Lato, Arial, sans-serif" font-size="16" font-weight="700" fill="#0c7161" text-anchor="start">1501–1800</text>
  <text x="652" y="501" font-family="Lato, Arial, sans-serif" font-size="20" font-weight="400" fill="#143c38" text-anchor="start">Tooling and libraries</text>
  <text x="537" y="538" font-family="Lato, Arial, sans-serif" font-size="16" font-weight="700" fill="#0c7161" text-anchor="start">1801–2100</text>
  <text x="652" y="538" font-family="Lato, Arial, sans-serif" font-size="20" font-weight="400" fill="#143c38" text-anchor="start">Concurrency and async</text>
  <text x="537" y="575" font-family="Lato, Arial, sans-serif" font-size="16" font-weight="700" fill="#0c7161" text-anchor="start">2101–2400</text>
  <text x="652" y="575" font-family="Lato, Arial, sans-serif" font-size="20" font-weight="400" fill="#143c38" text-anchor="start">Algorithms and performance</text>
  <text x="537" y="612" font-family="Lato, Arial, sans-serif" font-size="16" font-weight="700" fill="#0c7161" text-anchor="start">2401–2700</text>
  <text x="652" y="612" font-family="Lato, Arial, sans-serif" font-size="20" font-weight="400" fill="#143c38" text-anchor="start">Systems Rust</text>
  <text x="537" y="649" font-family="Lato, Arial, sans-serif" font-size="16" font-weight="700" fill="#0c7161" text-anchor="start">2701–3000</text>
  <text x="652" y="649" font-family="Lato, Arial, sans-serif" font-size="20" font-weight="400" fill="#143c38" text-anchor="start">Applied mastery</text>
  <line x1="50" y1="677" x2="990" y2="677" stroke="#d7dcd2" stroke-width="1" />
  <text x="50" y="713" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="700" fill="#42625c" text-anchor="start">Practice time targets</text>
  <text x="232" y="713" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="400" fill="#143c38" text-anchor="start">Beginner tasks  5–15 min</text>
  <text x="501" y="713" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="400" fill="#143c38" text-anchor="start">Advanced tasks  15–30 min</text>
</svg>